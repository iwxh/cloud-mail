name: New Cloud Mail service

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'New active CF zone, lowercase only (example.com). Creates mail.example.com and admin@example.com.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-mail-provision-${{ inputs.domain }}
  cancel-in-progress: false

jobs:
  provision:
    environment: mail-provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAIL_DOMAIN: ${{ inputs.domain }}
      MAIL_FORWARD_TO_OWNER: ${{ vars.MAIL_FORWARD_TO_OWNER }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only conflict and ownership checks
        env:
          MAIL_OWNER_EMAIL: ${{ secrets.MAIL_OWNER_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node --experimental-vm-modules automation/provision.mjs --plan
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - name: Install pinned dependencies
        run: |
          pnpm --dir mail-worker install --frozen-lockfile
          pnpm --dir mail-vue install --frozen-lockfile
      - name: Run offline safety tests
        run: node --experimental-vm-modules --test automation/test/*.test.mjs
      - name: Build website
        run: pnpm --dir mail-vue run build
      - name: Create or resume this domain only
        env:
          MAIL_OWNER_EMAIL: ${{ secrets.MAIL_OWNER_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node --experimental-vm-modules automation/provision.mjs --apply
