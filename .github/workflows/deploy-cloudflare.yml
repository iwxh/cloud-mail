name: Validate reusable QQ template (no deployment)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  template-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test template configuration and Sender handling without network calls
        working-directory: mail-worker
        run: npm run test:template
