name: First-domain acceptance (approval required)

on:
  pull_request:
    branches: [main]
    types: [synchronize, ready_for_review]
    paths:
      - '.github/workflows/first-domain-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    if: >-
      github.repository == 'iwxh/cloud-mail' &&
      github.event.pull_request.number == 3 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/oneclick-cf-mail' &&
      github.event.pull_request.draft == false
    uses: ./.github/workflows/new-mail-service.yml
    with:
      domain: iwxh.cc
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAIL_OWNER_EMAIL: ${{ secrets.MAIL_OWNER_EMAIL }}
